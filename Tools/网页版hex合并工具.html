<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <title>HEX固件合并工具 | HEX Firmware Merge Tool</title>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --background: #ecf0f1;
        }

        body {
            font-family: 'Segoe UI', system-ui, "Microsoft YaHei", sans-serif;
            margin: 0;
            padding: 2rem;
            background: var(--background);
            min-height: 100vh;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
        }

        .tool-header {
            text-align: center;
            margin-bottom: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .lang-switcher {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .lang-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--secondary);
            border-radius: 6px;
            cursor: pointer;
            background: white;
            color: var(--secondary);
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--secondary);
            color: white;
        }

        .tool-header h1 {
            color: var(--primary);
            margin: 0;
            font-size: 2.2rem;
        }

        .file-section {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .file-card {
            background: var(--background);
            border-radius: 8px;
            padding: 1.5rem;
            transition: transform 0.2s;
        }

        .file-card:hover {
            transform: translateY(-2px);
        }

        .file-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
            margin-top: 1rem;
        }

        .file-name {
            flex: 1;
            padding: 0.8rem;
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .version-input-area {
            margin: 1.5rem 0;
            padding: 1rem;
            background: var(--background);
            border-radius: 8px;
        }

        .version-input-area label {
            font-weight: 500;
            margin-right: 1rem;
        }

        .version-input {
            padding: 0.8rem;
            width: 300px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .btn {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
            min-width: 80px;
        }

        .btn-primary {
            background: var(--secondary);
            color: white;
        }

        .btn-primary:hover {
            background: #2980b9;
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover {
            background: #219a52;
        }

        .status-area {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--background);
            border-radius: 8px;
            min-height: 60px;
        }

        #status-message {
            color: var(--primary);
            font-size: 0.95rem;
            line-height: 1.6;
            white-space: pre-wrap; /* 保留换行 */
            word-wrap: break-word; /* 自动换行 */
        }

        .progress-bar {
            height: 6px;
            background: #ddd;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: var(--secondary);
            transition: width 0.3s ease;
        }

        input[type="file"] {
            display: none;
        }

        .file-info {
            font-size: 0.9rem;
            color: #666;
            margin-top: 0.5rem;
            line-height: 1.5;
        }

        .segment-info {
            margin-top: 0.8rem;
            padding: 0.8rem;
            background: #f8f9fa;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .note-text {
            color: var(--error);
            font-size: 0.9rem;
            margin-top: 0.5rem;
            padding: 0.5rem;
            background: #fff3cd;
            border-radius: 4px;
        }

        .address-info {
            margin-top: 1rem;
            padding: 1rem;
            background: #e8f4fd;
            border-radius: 6px;
            font-family: monospace;
        }

// 1. 完全匹配C代码的CRC32计算函数（MPEG-2标准）
class CRC32Calculator {
    constructor() {
        this.CRC32_MPEG2_INIT = 0xFFFFFFFF;   // 初始值
        this.CRC32_MPEG2_POLY = 0x04C11DB7;   // 多项式（剥离最高位1）
        this.CRC32_MPEG2_XOROUT = 0x00000000; // 输出异或值
    }

    // 完全复刻C代码的逐位计算逻辑
    calculate(buffer) {
        let crc = this.CRC32_MPEG2_INIT; // 初始化CRC值
        
        for (let i = 0; i < buffer.length; i++) {
            const byte = buffer[i] & 0xFF; // 取当前字节（确保8位）
            crc ^= (byte << 24);          // 字节左移24位后异或（关键匹配点）
            
            // 逐位处理8个位
            for (let bit = 0; bit < 8; bit++) {
                if (crc & 0x80000000) {   // 检查最高位是否为1
                    crc = (crc << 1) ^ this.CRC32_MPEG2_POLY;
                } else {
                    crc = crc << 1;
                }
                crc = crc >>> 0; // 确保无符号32位（JavaScript补位处理）
            }
        }
        
        // 输出异或（这里为0，仅返回原始值）
        return (crc ^ this.CRC32_MPEG2_XOROUT) >>> 0;
    }
}

// 工具函数：将32位数值拆分为4个字节（小端序：低字节在前，高字节在后）
function uint32ToBytesLE(value) {
    const bytes = new Uint8Array(4);
    bytes[0] = (value) & 0xFF;       // 低字节（偏移0）
    bytes[1] = (value >> 8) & 0xFF;  // 偏移1
    bytes[2] = (value >> 16) & 0xFF; // 偏移2
    bytes[3] = (value >> 24) & 0xFF; // 高字节（偏移3）
    return bytes;
}

// 更新页面语言
function updateLanguage(lang) {
    currentLang = lang;
    const t = translations[lang];
    
    // 更新静态文本
    document.getElementById('title').textContent = t.title;
    document.getElementById('subtitle').textContent = t.subtitle;
    document.getElementById('bl-title').textContent = t.bl_title;
    document.getElementById('app-title').textContent = t.app_title;
    document.getElementById('bl-select-btn').textContent = t.bl_select_btn;
    document.getElementById('app-select-btn').textContent = t.app_select_btn;
    document.getElementById('version-label').textContent = t.version_label;
    document.getElementById('version-input').placeholder = t.version_placeholder;
    document.getElementById('version-note').textContent = t.version_note;
    document.getElementById('merge-btn').textContent = t.merge_btn;
    
    // 更新初始状态文本
    if (document.getElementById('status-message').textContent === translations.zh.status_ready || 
        document.getElementById('status-message').textContent === translations.en.status_ready) {
        document.getElementById('status-message').textContent = t.status_ready;
    }
    if (document.getElementById('bootloader-name').textContent === translations.zh.bootloader_name ||
        document.getElementById('bootloader-name').textContent === translations.en.bootloader_name) {
        document.getElementById('bootloader-name').textContent = t.bootloader_name;
    }
    if (document.getElementById('app-name').textContent === translations.zh.app_name ||
        document.getElementById('app-name').textContent === translations.en.app_name) {
        document.getElementById('app-name').textContent = t.app_name;
    }
    if (document.getElementById('bootloader-info').textContent === translations.zh.bootloader_info ||
        document.getElementById('bootloader-info').textContent === translations.en.bootloader_info) {
        document.getElementById('bootloader-info').textContent = t.bootloader_info;
    }
    if (document.getElementById('app-info').textContent === translations.zh.app_info ||
        document.getElementById('app-info').textContent === translations.en.app_info) {
        document.getElementById('app-info').textContent = t.app_info;
    }
    
    // 更新语言按钮状态
    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
    });
    
    // 如果已有APP段信息，重新渲染
    if (selectedFiles.app.segments.length > 0) {
        displayAppSegments(selectedFiles.app.segments);
    }
    
    // 如果已有INFO地址信息，重新渲染
    const addrInfoEl = document.getElementById('address-info');
    if (addrInfoEl.style.display !== 'none') {
        // 重新渲染INFO地址信息（需要缓存INFO地址数据）
        const infoBaseAddr = addrInfoEl.dataset.infoBase || '';
        const infoAddrs = addrInfoEl.dataset.infoAddrs ? JSON.parse(addrInfoEl.dataset.infoAddrs) : [];
        if (infoBaseAddr && infoAddrs.length > 0) {
            renderInfoAddressInfo(infoBaseAddr, infoAddrs);
        }
    }
}

// 格式化翻译文本（替换占位符）
function t(key, params = {}) {
    let text = translations[currentLang][key] || key;
    Object.keys(params).forEach(param => {
        text = text.replace(`{${param}}`, params[param]);
    });
    return text;
}

    addrInfoEl.style.display = 'block';
    addrInfoEl.innerHTML = `
        <strong>${t('info_addr_title')}</strong><br>
        ${t('info_base_addr', { addr: INFO_BASE_ADDRESS.toString(16).toUpperCase() })}<br>
        ${t('info_addr1', { addr: infoAddresses[0].toString(16).toUpperCase() })}<br>
        ${t('info_addr2', { addr: infoAddresses[1].toString(16).toUpperCase() })}<br>
        ${t('info_addr3', { addr: infoAddresses[2].toString(16).toUpperCase() })}<br>
        ${t('info_addr4', { addr: infoAddresses[3].toString(16).toUpperCase() })}
    `;
}

    document.querySelectorAll('.lang-btn').forEach(btn => {

        });
    });

// 初始化文件输入
function initFileInput(inputId, fileType) {
    const input = document.getElementById(inputId);
    input.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        // 验证文件类型
        if (!file.name.toLowerCase().endsWith('.hex')) {
            updateStatus(t('file_type_error', { name: file.name }), false, true);
            return;
        }
        
        try {
            // 读取并解析HEX文件
            const typeText = fileType === 'bootloader' ? (currentLang === 'zh' ? 'BootLoader' : 'BootLoader') : (currentLang === 'zh' ? 'APP' : 'APP');
            updateStatus(t('parsing_file', { type: typeText, name: file.name }));
            const hexContent = await readHexFile(file);
            const parseResult = parseHexFile(hexContent); // 调用修正后的解析函数
            
            // 存储文件信息
            selectedFiles[fileType].file = file;
            selectedFiles[fileType].segments = parseResult.segments;
            selectedFiles[fileType].baseAddress = parseResult.baseAddress;
            selectedFiles[fileType].maxAddress = parseResult.maxAddress;
            selectedFiles[fileType].binData = parseResult.binData;
            selectedFiles[fileType].segCount = parseResult.segments.length;
            
            // 计算APP总长度（多段填充0xFF）
            if (fileType === 'app') {
                selectedFiles[fileType].totalLength = parseResult.totalLength;
                // 显示APP段信息
                displayAppSegments(parseResult.segments);
            }
            
            // 更新UI
            document.getElementById(`${fileType}-name`).textContent = file.name;
            document.getElementById(`${fileType}-info`).textContent = 
                t('parse_info', { 
                    start: parseResult.baseAddress.toString(16).toUpperCase(),
                    end: parseResult.maxAddress.toString(16).toUpperCase(),
                    len: parseResult.binData.length,
                    segCount: parseResult.segments.length
                });
            
            updateUI();
            updateStatus(t('parse_success', { type: typeText, name: file.name }), true);
            
        } catch (error) {
            updateStatus(t('parse_failed', { type: fileType === 'bootloader' ? (currentLang === 'zh' ? 'BootLoader' : 'BootLoader') : (currentLang === 'zh' ? 'APP' : 'APP'), msg: error.message }), false, true);
            selectedFiles[fileType].file = null;
            document.getElementById(`${fileType}-name`).textContent = t(`${fileType}_name`);
            document.getElementById(`${fileType}-info`).textContent = t('parse_failed', { type: fileType === 'bootloader' ? (currentLang === 'zh' ? 'BootLoader' : 'BootLoader') : (currentLang === 'zh' ? 'APP' : 'APP'), msg: error.message });
            if (fileType === 'app') {
                document.getElementById('app-segment-info').textContent = '';
            }
        }
    });
}

// 读取HEX文件（指定UTF-8编码）
async function readHexFile(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = (e) => reject(new Error(t('file_read_error', { msg: e.message })));
        reader.readAsText(file, 'UTF-8');
    });
}

// 最终修正：按地址连续性划分段的HEX解析函数
function parseHexFile(hexString) {
    const lines = hexString.split('\n').map(line => line.trim()).filter(line => line && line[0] === ':');
    
    // 寻址相关变量
    let segmentAddress = 0;    // 02类型：扩展段地址（16位），段基址 = segmentAddress * 16
    let linearAddress = 0;     // 04类型：扩展线性地址（16位），线性基址 = linearAddress * 65536
    
    // 存储所有物理地址和对应的值（有序）
    const addressMap = new Map(); // key: 物理地址, value: 字节值
    let lastAddress = -1;         // 上一个数据的物理地址
    let currentSegAddr = 0;       // 当前生效的段地址
    
    // 第一遍解析：收集所有物理地址数据
    for (const line of lines) {
        if (line.length < 11) continue;
        
        try {
            // 解析HEX行基础信息
            const byteCount = parseInt(line.substr(1, 2), 16);
            const offset = parseInt(line.substr(3, 4), 16); // 偏移地址（16位）
            const recordType = parseInt(line.substr(7, 2), 16);
            const data = line.substr(9, byteCount * 2);
            
            switch (recordType) {
                case 0x00: // 00类型：数据记录
                    // 计算物理地址
                    let physicalAddress;
                    if (linearAddress > 0) {
                        physicalAddress = linearAddress + offset;
                        currentSegAddr = linearAddress >> 16; // 线性地址的高16位作为段地址
                    } else {
                        physicalAddress = (segmentAddress * 16) + offset;
                        currentSegAddr = segmentAddress; // 段地址
                    }
                    
                    // 提取数据字节并存储到地址映射
                    for (let i = 0; i < byteCount; i++) {
                        const addr = physicalAddress + i;
                        const byteValue = parseInt(data.substr(i * 2, 2), 16);
                        addressMap.set(addr, byteValue);
                        lastAddress = addr;
                    }
                    break;
                    
                case 0x02: // 02类型：扩展段地址记录
                    if (byteCount === 2) {
                        segmentAddress = parseInt(data.substr(0, 4), 16);
                        linearAddress = 0; // 段地址和线性地址互斥
                    }
                    break;
                    
                case 0x04: // 04类型：扩展线性地址记录
                    if (byteCount === 2) {
                        linearAddress = parseInt(data.substr(0, 4), 16) * 65536;
                        segmentAddress = 0; // 段地址和线性地址互斥
                    }
                    break;
                    
                case 0x01: // 01类型：结束记录
                    break;
                    
                default:
                    // 忽略其他记录类型（03/05等）
                    break;
            }
        } catch (e) {
            console.warn(`解析HEX行失败: ${line}, 错误: ${e.message}`);
            continue;
        }
    }
    
    // 验证是否有有效数据
    if (addressMap.size === 0) {
        throw new Error(t('no_segments_error'));
    }
    
    // 按地址排序
    const sortedAddresses = Array.from(addressMap.keys()).sort((a, b) => a - b);
    const baseAddress = sortedAddresses[0];
    const maxAddress = sortedAddresses[sortedAddresses.length - 1];
    
    // 第二遍解析：按地址连续性划分段
    const segments = [];
    let currentSegment = null;
    
    for (const addr of sortedAddresses) {
        const value = addressMap.get(addr);
        
        // 判断是否为新段：当前地址与上一个地址不连续（差值>1）
        if (!currentSegment || (addr > (currentSegment.end + 1))) {
            // 保存当前段（如果存在）
            if (currentSegment) {
                segments.push(currentSegment);
            }
            
            // 创建新段
            currentSegment = {
                segAddr: currentSegAddr,
                start: addr,
                end: addr,
                size: 1,
                data: [value]
            };
        } else {
            // 地址连续，追加到当前段
            currentSegment.end = addr;
            currentSegment.size = currentSegment.end - currentSegment.start + 1;
            currentSegment.data.push(value);
        }
    }
    
    // 添加最后一个段
    if (currentSegment) {
        segments.push(currentSegment);
    }
    
    // 构建完整的BIN数据（多段之间填充0xFF）
    const totalLength = maxAddress - baseAddress + 1;
    const binData = new Uint8Array(totalLength).fill(0xFF);
    
    addressMap.forEach((value, addr) => {
        const offset = addr - baseAddress;
        if (offset >= 0 && offset < totalLength) {
            binData[offset] = value;
        }
    });
    
    return {
        segments: segments,       // 按地址连续性划分的段
        baseAddress: baseAddress, // 全局最小物理地址
        maxAddress: maxAddress,   // 全局最大物理地址
        binData: binData,         // 完整的BIN数据（填充0xFF）
        totalLength: totalLength  // 总长度
    };
}

// 修正后的APP段信息显示（展示地址连续性）
function displayAppSegments(segments) {
    const infoEl = document.getElementById('app-segment-info');
    if (segments.length === 0) {
        infoEl.innerHTML = '';
        return;
    }
    
    let html = `<strong>${t('app_segment_info', { count: segments.length })}</strong><br>`;
    
    segments.forEach((seg, index) => {
        // 判断段内地址是否完全连续（理论上都是连续的，这里做验证）
        const isContinuous = (seg.end - seg.start + 1) === seg.size;
        const continuousText = currentLang === 'zh' ? (isContinuous ? '连续' : '不连续') : (isContinuous ? 'Continuous' : 'Discontinuous');
        
        html += `${t('app_segment_item', { 
            index: index + 1,
            segAddr: seg.segAddr.toString(16).toUpperCase().padStart(4, '0'),
            start: seg.start.toString(16).toUpperCase(),
            end: seg.end.toString(16).toUpperCase(),
            size: seg.size,
            continuous: continuousText
        })}<br>`;
    });
    
    infoEl.innerHTML = html;
}

// 更新UI状态
function updateUI() {
    const mergeBtn = document.querySelector('.btn-success');
    mergeBtn.disabled = !(selectedFiles.bootloader.file && selectedFiles.app.file);
}

// 更新状态信息
function updateStatus(text, isSuccess = false, isError = false) {
    const statusEl = document.getElementById('status-message');
    statusEl.textContent = text;
    // 明确指定颜色
    const errorColor = '#e74c3c';
    const successColor = '#27ae60';
    const primaryColor = '#2c3e50';
    statusEl.style.color = isError ? errorColor : isSuccess ? successColor : primaryColor;
    
    // 滚动到状态区域
    statusEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// 显示进度
function showProgress(percent) {
    document.querySelector('.progress-fill').style.width = `${percent}%`;
}

// 检查地址范围是否重叠
function checkAddressOverlap(range1, range2) {
    return !(range1.end < range2.start || range2.end < range1.start);
}

// 检查单个地址是否在指定范围内
function isAddressInRange(addr, range) {
    return addr >= range.start && addr <= range.end;
}

// 将32位数值转换为4字节数组（大端）
function uint32ToBytes(value) {
    return [
        (value >> 24) & 0xFF,
        (value >> 16) & 0xFF,
        (value >> 8) & 0xFF,
        value & 0xFF
    ];
}

// BIN转换为HEX格式
function binToHex(binData, baseAddress) {
    const hexLines = [];
    const bytesPerLine = 16; // 每行16字节
    
    for (let i = 0; i < binData.length; i += bytesPerLine) {
        const byteCount = Math.min(bytesPerLine, binData.length - i);
        const address = baseAddress + i;
        
        // 处理扩展地址
        const addressHigh = (address >> 16) & 0xFFFF;
        const addressLow = address & 0xFFFF;
        
        // 需要添加扩展地址记录
        if (addressHigh !== 0 && (i === 0 || (address & 0xFFFF0000) !== ((address - bytesPerLine) & 0xFFFF0000))) {
            const extRecord = [
                0x02,        // 字节数
                0x00, 0x00,  // 地址
                0x04,        // 扩展地址记录类型
                (addressHigh >> 8) & 0xFF,
                addressHigh & 0xFF
            ];
            // 计算校验和
            const extChecksum = (~extRecord.reduce((sum, b) => sum + b, 0) + 1) & 0xFF;
            extRecord.push(extChecksum);
            // 添加到HEX行
            hexLines.push(':' + extRecord.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(''));
        }
        
        // 构建数据记录
        const record = [
            byteCount,
            (addressLow >> 8) & 0xFF,
            addressLow & 0xFF,
            0x00 // 数据记录类型
        ];
        
        // 添加数据字节
        for (let j = 0; j < byteCount; j++) {
            record.push(binData[i + j]);
        }
        
        // 计算校验和
        const checksum = (~record.reduce((sum, b) => sum + b, 0) + 1) & 0xFF;
        record.push(checksum);
        
        // 添加到HEX行
        hexLines.push(':' + record.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join(''));
    }
    
    // 添加结束记录
    hexLines.push(':00000001FF');
    
    return hexLines.join('\n');
}

// 保存文件函数 - 按指定规则生成文件名
async function saveHexFile(binData, baseAddress) {
    const hexContent = binToHex(binData, baseAddress);
    const hexBlob = new Blob([hexContent], { type: 'text/plain; charset=UTF-8' });
    
    // 获取Bootloader和APP文件名（去除后缀）
    const blFileName = selectedFiles.bootloader.file.name.replace(/\.hex$/i, '');
    const appFileName = selectedFiles.app.file.name.replace(/\.hex$/i, '');
    // 生成新文件名：Bootloader_CRC_Application_merged.hex
    const mergedFileName = `${blFileName}_${appFileName}_merged.hex`;
    
    try {
        if (window.showSaveFilePicker) {
            const handle = await window.showSaveFilePicker({
                suggestedName: mergedFileName,
                types: [{
                    description: currentLang === 'zh' ? 'HEX文件' : 'HEX File',
                    accept: { 'text/plain': ['.hex'] }
                }]
            });
            const writable = await handle.createWritable();
            await writable.write(hexBlob);
            await writable.close();
        } else {
            const link = document.createElement('a');
            link.href = URL.createObjectURL(hexBlob);
            link.download = mergedFileName;
            link.click();
            setTimeout(() => URL.revokeObjectURL(link.href), 100);
        }
        return true;
    } catch (error) {
        if (error.name !== 'AbortError') throw error;
        return false;
    }
}

// 开始合并流程
async function startMerge() {
    // 验证文件选择
    if (!selectedFiles.bootloader.file || !selectedFiles.app.file) {
        updateStatus(t('no_files_selected'), false, true);
        return;
    }
    
    try {
        showProgress(10);
        updateStatus(t('merge_start'));
        
        // 1. 提取基础信息
        const bl = selectedFiles.bootloader;
        const app = selectedFiles.app;
        
        // 显示基础信息
        updateStatus(t('bl_range_info', { 
            start: bl.baseAddress.toString(16).toUpperCase(),
            end: bl.maxAddress.toString(16).toUpperCase()
        }));
        showProgress(20);
        
        // 2. 检查地址重叠
        updateStatus(t('checking_overlap'));
        const blRange = { start: bl.baseAddress, end: bl.maxAddress };
        const appRange = { start: app.baseAddress, end: app.maxAddress };
        
        if (checkAddressOverlap(blRange, appRange)) {
            throw new Error(t('overlap_error', {
                bl_start: bl.baseAddress.toString(16).toUpperCase(),
                bl_end: bl.maxAddress.toString(16).toUpperCase(),
                app_start: app.baseAddress.toString(16).toUpperCase(),
                app_end: app.maxAddress.toString(16).toUpperCase()
            }));
        }
        updateStatus(t('overlap_ok'));
        showProgress(30);
        
        // 3. 检查1K INFO区间（使用APP第一段的物理起始地址）
        updateStatus(t('checking_info_space'));
        const appFirstSegmentStart = app.segments.length > 0 ? app.segments[0].start : app.baseAddress;
        const requiredGap = 0x400; // 1024字节
        const gapBetween = appFirstSegmentStart - bl.maxAddress - 1;
        
        if (gapBetween < requiredGap) {
            throw new Error(t('info_space_error', {
                required: requiredGap.toString(16).toUpperCase(),
                actual: gapBetween.toString(16).toUpperCase(),
                bl_end: bl.maxAddress.toString(16).toUpperCase(),
                app_start: appFirstSegmentStart.toString(16).toUpperCase()
            }));
        }
        updateStatus(t('info_space_ok'));
        showProgress(40);
        
        // 4. 计算INFO_BASE_ADDRESS
        const INFO_BASE_ADDRESS = appFirstSegmentStart - 0x400;
        const infoAddresses = [
            INFO_BASE_ADDRESS,          // 地址1：0x55AAAA55
            INFO_BASE_ADDRESS + 4,      // 地址2：APP长度
            INFO_BASE_ADDRESS + 8,      // 地址3：APP CRC32
            INFO_BASE_ADDRESS + 0x3FC   // 地址4：INFO区间CRC32（恢复原始地址）
        ];
        
        // 显示INFO地址信息
        renderInfoAddressInfo(INFO_BASE_ADDRESS, infoAddresses);
        updateStatus(t('calc_info_base', { addr: INFO_BASE_ADDRESS.toString(16).toUpperCase() }));
        showProgress(50);
        
        // 5. 检查INFO地址是否与现有地址重叠
        updateStatus(t('checking_info_addr'));
        for (let i = 0; i < infoAddresses.length; i++) {
            const addr = infoAddresses[i];
            if (isAddressInRange(addr, blRange) || isAddressInRange(addr, appRange)) {
                throw new Error(t('info_addr_error', {
                    addr: addr.toString(16).toUpperCase(),
                    index: i + 1
                }));
            }
        }
        updateStatus(t('info_addr_ok'));
        showProgress(60);
        
        // 6. 构建INFO区间数据
        updateStatus(t('building_info_data'));
        const infoData = new Uint8Array(0x400).fill(0xFF); // 1024字节，初始填充0xFF
        
        // 地址1: 写入0x55AAAA55（小端序）
        const magicValue = 0x55AAAA55;
        infoData.set(uint32ToBytesLE(magicValue), 0);
        
        // 地址2: 写入APP总长度（小端序）
        const appLengthValue = app.totalLength;
        infoData.set(uint32ToBytesLE(appLengthValue), 4);
        
        // 地址3: 写入APP CRC32（小端序）
        const appCrc32 = crc32Calc.calculate(app.binData);
        infoData.set(uint32ToBytesLE(appCrc32), 8);
        
        // 计算INFO区间前1020字节的CRC32（0x000-0x3FB）
        const infoCrcData = infoData.subarray(0, 1020); // 前1020字节
        const infoCrc32 = crc32Calc.calculate(infoCrcData);
        
        // 地址4: 写入INFO区间CRC32到0x3FC位置（小端序）
        infoData.set(uint32ToBytesLE(infoCrc32), 0x3FC);
        
        updateStatus(t('info_data_ok'));
        showProgress(70);
        
        // 7. 合并所有数据
        updateStatus(t('merging_data'));
        
        // 计算总内存范围
        const allRanges = [
            { start: bl.baseAddress, end: bl.maxAddress },
            { start: INFO_BASE_ADDRESS, end: INFO_BASE_ADDRESS + 0x3FF },
            { start: app.baseAddress, end: app.maxAddress }
        ];
        const globalStart = Math.min(...allRanges.map(r => r.start));
        const globalEnd = Math.max(...allRanges.map(r => r.end));
        const globalSize = globalEnd - globalStart + 1;
        
        // 创建合并后的BIN数据
        const mergedBin = new Uint8Array(globalSize).fill(0xFF);
        
        // 写入BootLoader
        mergedBin.set(bl.binData, bl.baseAddress - globalStart);
        
        // 写入INFO区间
        mergedBin.set(infoData, INFO_BASE_ADDRESS - globalStart);
        
        // 写入APP
        mergedBin.set(app.binData, app.baseAddress - globalStart);
        
        // 8. 添加版本号（如果有）
        let finalBin = mergedBin;
        const versionStr = document.getElementById('version-input').value.trim();
        if (versionStr) {
            updateStatus(t('adding_version'));
            const versionBytes = new TextEncoder().encode(versionStr);
            finalBin = new Uint8Array(mergedBin.length + versionBytes.length);
            finalBin.set(mergedBin);
            finalBin.set(versionBytes, mergedBin.length);
        }
        
        // 9. 计算最终程序部分的CRC32（不包含版本号）
        const programCrc32 = crc32Calc.calculate(mergedBin);
        const programLength = mergedBin.length;
        
        updateStatus(t('merge_data_ok'));
        showProgress(80);
        
        // 10. 保存HEX文件
        updateStatus(t('saving_file'));
        const saveSuccess = await saveHexFile(finalBin, globalStart);
        
        if (saveSuccess) {
            showProgress(100);
            
            // 输出最终日志信息
            const versionNote = versionStr ? t('version_added', { version: versionStr }) : t('version_not_added');
            const logMsg = t('merge_success_info', {
                length: programLength,
                length_hex: programLength.toString(16).toUpperCase(),
                crc32: programCrc32.toString(16).toUpperCase().padStart(8, '0'),
                info_base: INFO_BASE_ADDRESS.toString(16).toUpperCase(),
                addr1: infoAddresses[0].toString(16).toUpperCase(),
                magic: magicValue.toString(16).toUpperCase().padStart(8, '0'),
                addr2: infoAddresses[1].toString(16).toUpperCase(),
                app_len_hex: appLengthValue.toString(16).toUpperCase().padStart(8, '0'),
                app_len: appLengthValue,
                addr3: infoAddresses[2].toString(16).toUpperCase(),
                app_crc32: appCrc32.toString(16).toUpperCase().padStart(8, '0'),
                addr4: infoAddresses[3].toString(16).toUpperCase(),
                info_crc32: infoCrc32.toString(16).toUpperCase().padStart(8, '0'),
                version_note: versionNote
            });
            
            updateStatus(`${t('merge_success_title')}\n${logMsg}`, true);
        } else {
            updateStatus(t('save_canceled'), false);
        }
        
    } catch (error) {
        updateStatus(t('merge_failed', { msg: error.message }), false, true);
    } finally {
        setTimeout(() => showProgress(0), 1000);
    }
}
</script>
